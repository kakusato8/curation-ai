name = "curation-ai-workers"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# KV Namespaces
[[kv_namespaces]]
binding = "CURATION_DB"
id = "b6d4ce2b389d490a98df0a491639cf9d"
preview_id = "f688a1f3a80242289daa4b5f29dfacb1"

# Cron Triggers  
[triggers]
crons = ["0 20 * * *"]  # Every day at 5:00 AM JST (20:00 UTC)

# Environment Variables
[vars]
ENVIRONMENT = "production"

# Secrets (set with wrangler secret put)
# GEMINI_API_KEY
# EMAIL_USER  
# EMAIL_PASSWORD
# JWT_SECRET